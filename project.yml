name: Parley
options:
  xcodeVersion: "27.0"   # marks the generated project as current, so Xcode stops offering setting upgrades
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ECKB9WN282
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
packages:
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    exactVersion: 1.38.1
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Parley:
    type: application
    platform: macOS
    sources:
      - path: Parley
        type: syncedFolder
    dependencies:
      - package: SwiftProtobuf
      - package: Sparkle
    info:
      path: Parley/Info.plist
      properties:
        NSUserActivityTypes: [INSendMessageIntent]   # communication notifications
        NSMicrophoneUsageDescription: Parley records voice messages with the microphone when you choose to.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: https://github.com/cuza/Parley/releases/latest/download/appcast.xml   # Sparkle updates
        SUPublicEDKey: VxKIqSk8XgX3+P7VBItQ2xHV3CX1AVsMeWpBRNMDVsc=
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.cuza.Parley
        MARKETING_VERSION: "1.5.2"
        CURRENT_PROJECT_VERSION: "54"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Parley/Parley.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Parley
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.social-networking
  ParleyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ParleyTests
        type: syncedFolder
    dependencies:
      - target: Parley
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  ParleyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ParleyUITests
        type: syncedFolder
    dependencies:
      - target: Parley
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Parley
schemes:
  Parley:
    build:
      targets:
        Parley: all
        ParleyTests: [test]
        ParleyUITests: [test]
    test:
      targets: [ParleyTests, ParleyUITests]
